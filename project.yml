# XcodeGen spec — the source of truth for Aster.xcodeproj (both are
# committed; regenerate with `xcodegen` from this directory after editing).
name: Aster
options:
  bundleIdPrefix: com.ryandoesdesign
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: 5U34MG28NQ
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  LHKit:
    path: Packages/LHKit
  Highlightr:
    url: https://github.com/raspu/Highlightr
    exactVersion: 2.3.0
targets:
  Aster:
    type: application
    platform: macOS
    sources: [Aster]
    dependencies:
      - package: LHKit
        product: LHCore
      - package: LHKit
        product: LHResources
      - package: LHKit
        product: LHStore
      - package: LHKit
        product: LHImport
      - package: LHKit
        product: LHAnthropic
      - package: LHKit
        product: LHAgent
      - package: LHKit
        product: LHMarkdown
      - package: LHKit
        product: LHWeb
      - package: Highlightr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryandoesdesign.Aster
        PRODUCT_NAME: Aster
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aster
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Ryan Tessier"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Aster uses the microphone for dictation. Speech is transcribed on this Mac and never leaves it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Aster transcribes your dictation on this Mac."
        CODE_SIGN_ENTITLEMENTS: Aster/Aster.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
  AsterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - AsterTests
      # The golden chats, readable inside the sandboxed host.
      - path: tests/fixtures/golden-data/chats
        type: folder
        buildPhase: resources
    dependencies:
      - target: Aster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryandoesdesign.AsterTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Aster.app/Contents/MacOS/Aster"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Aster:
    build:
      targets:
        Aster: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AsterTests
        - package: LHKit/LHCoreTests
        - package: LHKit/LHStoreTests
        - package: LHKit/LHImportTests
        - package: LHKit/LHAnthropicTests
        - package: LHKit/LHAgentTests
        - package: LHKit/LHMarkdownTests
        - package: LHKit/LHWebTests
